.top{display:flex;gap:8px;align-items:center}

.icon{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--velvet-2);color:var(--ink);cursor:pointer;padding:0}

.map{display:grid;gap:var(--gap,3px);width:max-content;margin:0 auto}

.foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- Parse a hall into seats ---------- */
function build(h){
  const raw = h.rows.map(r => { const [L, s] = r.split(':'); return { L, s }; });
  const maxLen = Math.max(...raw.map(r => r.s.length));

  const aisle = [...Array(maxLen)].map((_, c) => full.filter(r => r.s[c] === '.').length >= Math.max(2, full.length * .75));
  const colX = []; let x = 0;
  for (let c = 0; c < maxLen; c++){ const w = aisle[c] ? AISLE : PW; colX.push(x + w/2); x += w; }

  const nRows = raw.length, rake = nRows >= 10 ? .34 : .3;
  const screenW = Math.min(20, Math.max(7.5, width * .82));
  const firstZ = Math.max(4.2, screenW * .5);
  const seats = [], mapRows = [];
  raw.slice().reverse().forEach((row, r) => {            // r = 0 is the front row
    const s = row.s.padEnd(maxLen, '.'), y = r * rake, z = firstZ + r * ROW_D, cells = [];
    for (let c = 0; c < maxLen; c++){
      const ch = s[c];
      if (ch === '.') { cells.push({ gap: true, aisle: aisle[c] }); continue; }
      const num = base + nonAisleBefore(c);
      if (ch === 'd' && s[c+1] === 'd'){
        const seat = { row: row.L, r, label: `${num}–${num+1}`, w: 2, kind: 'duo', x: (colX[c] + colX[c+1]) / 2, y, z, i: seats.length };

      } else {
        const seat = { row: row.L, r, label: `${num}`, w: 1, kind: ch === 'w' ? 'wc' : ch === 'd' ? 'duo1' : 'std', x: colX[c], y, z, i: seats.length };
        seats.push(seat); cells.push({ seat });
      }
    }
    mapRows.unshift({ L: row.L, cells });
  });
  const places = seats.reduce((a, s) => a + s.w, 0);
  const aisleX = colX.filter((_, c) => aisle[c]);

  return { h, seats, mapRows, width, nRows, rake, screenW, screenH, screenBottom, firstZ, places, aisleX,

}

  group = new THREE.Group(); scene.add(group);
  const mat = (c, r=.85) => new THREE.MeshStandardMaterial({ color: c, roughness: r });
  const box = (w,hh,d,m,x,y,z) => { const o = new THREE.Mesh(new THREE.BoxGeometry(w,hh,d), m); o.position.set(x,y,z); group.add(o); return o; };
  const { hallW, hallLen, height } = H;
  box(hallW, .1, hallLen+1, mat(0x2a1a22), 0, -.05, hallLen/2);
  const wallM = mat(0x2b1620);
  box(.2, height, hallLen, wallM, -hallW/2, height/2, hallLen/2);
  box(.2, height, hallLen, wallM,  hallW/2, height/2, hallLen/2);
  box(hallW, height, .2, mat(0x120a0f), 0, height/2, -.3);
  box(hallW, height, .2, wallM, 0, height/2, hallLen);
  box(hallW, .2, hallLen, mat(0x0f090d), 0, height, hallLen/2);
  { const n = Math.floor(hallLen/0.9), im = new THREE.InstancedMesh(new THREE.BoxGeometry(.12, height*.72, .5), mat(0x4a2233,.7), n*2), m4 = new THREE.Matrix4();
    for (let i=0;i<n;i++) for (const sx of [-1,1]) { m4.makeTranslation(sx*(hallW/2-.15), height*.52, .8+i*.9); im.setMatrixAt(i*2+(sx>0), m4); } group.add(im); }
  const platM = mat(0x341f29);
  for (let r=1;r<=H.nRows;r++){
    const hh = r*H.rake, last = r===H.nRows, z = H.firstZ + r*ROW_D - ROW_D/2 + (last?1.2:0);
    box(hallW-.2, hh, ROW_D + (last?2.4:0), platM, 0, hh/2, z);
  }
  const lm = new THREE.MeshBasicMaterial({ color: 0xffb35c });
  const xs = [...H.aisleX, -H.width/2-.7, H.width/2+.7];
  for (let r=0;r<H.nRows;r++) for (const ax of xs) box(.35,.03,.04,lm, ax, r*H.rake+.03, H.firstZ + r*ROW_D - ROW_D/2 + .02);
  for (const sx of [-1,1]){ const e = mkLabel('EXIT','#4dff88',.9,.34); e.position.set(sx*(hallW/2-.12), 2.6, 2.5); e.rotation.y = -sx*Math.PI/2; group.add(e); }
  const screen = new THREE.Mesh(new THREE.PlaneGeometry(H.screenW, H.screenH), new THREE.MeshBasicMaterial({ map: stex, toneMapped:false }));
  screen.position.copy(H.SCREEN_C); screen.position.z = .05; group.add(screen);
  box(H.screenW+.6, H.screenH+.6, .05, new THREE.MeshBasicMaterial({ color: 0x050304 }), 0, H.SCREEN_C.y, 0);
  const curM = mat(0x5a1424,.95), curH = height-.4;
  for (const sx of [-1,1]) for (let i=0;i<10;i++){ const cx = sx*(H.screenW/2+.5+i*.17); if (Math.abs(cx) < hallW/2-.2) box(.18, curH, .25, curM, cx, curH/2, .25+(i%2)*.08); }
  screenLight.position.set(0, H.SCREEN_C.y, 2.5); backLight.position.set(0, height-1.5, hallLen-2);
  cushion = new THREE.InstancedMesh(new THREE.BoxGeometry(1,.14,.5), mat(0xffffff,.9), H.seats.length);
  back = new THREE.InstancedMesh(new THREE.BoxGeometry(1,.66,.12), mat(0xffffff,.9), H.seats.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion();
  H.seats.forEach(s => {
    const scl = new THREE.Vector3(s.w*PW - .08, 1, 1);
    if (s.kind === 'wc'){ m4.compose(new THREE.Vector3(s.x, s.y+.03, s.z), q, new THREE.Vector3(PW-.08,.3,1.2)); cushion.setMatrixAt(s.i, m4);
      m4.compose(new THREE.Vector3(s.x, s.y-.5, s.z), q, new THREE.Vector3(.01,.01,.01)); back.setMatrixAt(s.i, m4); return; }
    m4.compose(new THREE.Vector3(s.x, s.y+.44, s.z), q, scl); cushion.setMatrixAt(s.i, m4);
    m4.compose(new THREE.Vector3(s.x, s.y+.78, s.z+.26), q, scl); back.setMatrixAt(s.i, m4);
  });
  group.add(cushion, back);
  OVER_POS.set(0, H.SCREEN_C.y + (innerWidth < innerHeight ? 1.6 : 0.4), 0.7);
  OVER_T.set(0, H.nRows*H.rake*.5 + .9, H.firstZ + H.nRows*ROW_D*.55);
  camera.position.copy(OVER_POS); controls.target.copy(OVER_T); controls.enabled = true; curTarget.copy(OVER_T);
  H.best = H.seats.filter(s=>s.kind!=='wc').map(s=>({s,m:metrics(H,s)}))
    .sort((a,b)=>(Math.abs(a.m.hAngle-36)+a.m.off*.6)-(Math.abs(b.m.hAngle-36)+b.m.off*.6))[0].s;
  document.title = `${h.cinema} ${h.name}`;
  buildMap(); sizeMap(); paint(); render();
}

function paint(){
  H.seats.forEach(s=>{
    const c = s === current ? COL.cur : s === hovered ? COL.hov : COL[s.kind];
    cushion.setColorAt(s.i, c); back.setColorAt(s.i, c);
  });
  cushion.instanceColor.needsUpdate = back.instanceColor.needsUpdate = true;
}

/* ---------- Camera moves ---------- */
function startTween(toPos, toTarget, done){
  const fromPos = camera.position.clone(), fromT = (mode==='hall' ? controls.target.clone() : curTarget.clone());
  if (reduce){ camera.position.copy(toPos); curTarget.copy(toTarget); camera.lookAt(toTarget); done&&done(); return; }
  tween = { fromPos, fromT, toPos, toTarget, t: 0, done };
}
function sitIn(s){
  current = s; yaw = pitch = 0;
  controls.enabled = false;
  if (mode === 'hall') curTarget.copy(controls.target);
  startTween(metrics(H, s).eye, H.SCREEN_C.clone(), ()=>{ mode='seat'; });
  if (mode === 'hall') mode = 'moving';
  paint(); render();
}
function backToHall(){
  current = null;
  startTween(OVER_POS.clone(), OVER_T.clone(), ()=>{ mode='hall'; controls.target.copy(OVER_T); controls.enabled = true; });
  if (!reduce) mode = 'moving';
  paint(); render();
}
function step(d){ const n = H.seats[(current.i + d + H.seats.length) % H.seats.length]; sitIn(n); }

/* ---------- Picking ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
function pick(e){
  const r = renderer.domElement.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects([cushion, back])[0];
  return hit ? H.seats[hit.instanceId] : null;
}
const kindName = s => s.kind==='wc' ? 'Wheelchair place' : s.w===2 ? 'Duo seat' : 'Seat';
let down = null, dragging = false;
renderer.domElement.addEventListener('pointerdown', e=>{ down = {x:e.clientX,y:e.clientY,yaw,pitch}; dragging = false; });
renderer.domElement.addEventListener('pointermove', e=>{
  if (down && mode==='seat'){
    const dx = e.clientX-down.x, dy = e.clientY-down.y;
    if (Math.abs(dx)+Math.abs(dy) > 4) dragging = true;
    yaw = THREE.MathUtils.clamp(down.yaw - dx*.004, -1.2, 1.2);
    pitch = THREE.MathUtils.clamp(down.pitch - dy*.004, -.5, .6);
    return;
  }
  if (down && Math.abs(e.clientX-down.x)+Math.abs(e.clientY-down.y) > 4) dragging = true;
  if (e.pointerType === 'mouse'){
    const s = pick(e);
    if (s !== hovered){ hovered = s; paint(); }
    renderer.domElement.style.cursor = s ? 'pointer' : (mode==='seat'?'grab':'default');
  }
});
renderer.domElement.addEventListener('pointerup', e=>{ if (down && !dragging){ const s = pick(e); if (s) sitIn(s); } down = null; });
addEventListener('keydown', e=>{
  if (e.target.tagName === 'SELECT') return;
  if (e.target.tagName === 'BUTTON' && (e.key==='Enter'||e.key===' ')) return;
  if (e.key === 'Escape' && current) backToHall();
  if (current && e.key === 'ArrowRight') step(1);
  if (current && e.key === 'ArrowLeft') step(-1);
});

/* ---------- Panel ---------- */
const fmt = (v,d=1) => v.toFixed(d);
const sid = s => s.row + s.label;
function render(){
  $('free').innerHTML = `${H.places}<small>places libres</small>`;
  $('seat').textContent = current ? `${current.row} ${current.label}` : '';
  document.querySelectorAll('.s').forEach(b => b.classList.toggle('cur', !!current && +b.dataset.i === current.i));
}
function sizeMap(){
  const wrap = $('mapwrap'), map = $('map');
  const cols = Math.max(...H.mapRows.map(r => r.cells.reduce((a,c)=> a + (c.gap && c.aisle ? 1.4 : c.seat && c.seat.w===2 ? 2 : 1), 0)));
  const gap = 3, avail = wrap.clientWidth - 2*16 - 2*gap - 4;
  const n = H.mapRows[0].cells.length;
  let cell = Math.floor((avail - gap*(n+2)) / cols);
  const availH = wrap.clientHeight - 24;
  cell = Math.min(cell, Math.floor(availH / H.mapRows.length) - gap);
  cell = Math.max(7, Math.min(26, cell));
  map.style.setProperty('--cell', cell + 'px'); map.style.setProperty('--gap', gap + 'px');
}
function buildMap(){
  const map = $('map'); map.innerHTML = '';
  H.mapRows.forEach(row => {
    const div = document.createElement('div'); div.className = 'maprow';
    div.innerHTML = `<span class="rl">${row.L}</span>`;
    row.cells.forEach(cell => {
      if (cell.gap){ const g = document.createElement('span'); g.className = 'g' + (cell.aisle ? ' aisle' : ''); div.appendChild(g); return; }
      const s = cell.seat, b = document.createElement('button');
      b.className = 's ' + (s.w===2 ? 'duo' : s.kind); b.dataset.i = s.i; b.title = `${s.row} ${s.label}`;
      b.setAttribute('aria-label', `Rang ${s.row}, place ${s.label}`);
      b.onclick = () => sitIn(s); div.appendChild(b);
    });
    div.insertAdjacentHTML('beforeend', `<span class="rl">${row.L}</span>`);
    map.appendChild(div);
  });
}

/* ---------- Hall picker ---------- */
{
  const sel = $('hallSel');
  [...new Set(HALLS.map(h=>h.cinema))].forEach(cin => {
    const og = document.createElement('optgroup'); og.label = cin;
    HALLS.filter(h=>h.cinema===cin).forEach(h => { const o = document.createElement('option'); o.value = h.key; o.textContent = `${h.cinema} · ${h.name}`; og.appendChild(o); });
    sel.appendChild(og);
  });
  { const og = document.createElement('optgroup'); og.label = 'Festival'; const o = document.createElement('option'); o.value = 'carthage'; o.textContent = 'Festival · Théâtre romain de Carthage'; og.appendChild(o); sel.appendChild(og); }
  $('b-view').onclick = () => backToHall();
  $('book').onclick = () => { const b = $('book'); b.classList.add('pressed'); setTimeout(()=>b.classList.remove('pressed'), 180); };
  const fromHash = location.hash.slice(1);
  const start = HALLS.some(h=>h.key===fromHash) ? fromHash : DEFAULT_KEY;
  sel.value = start;
  sel.onchange = () => { if (sel.value === 'carthage') { location.href = 'carthage.html'; return; } loadHall(sel.value); try { history.replaceState(null, '', '#' + sel.value); } catch(e){} };
  loadHall(start);
}

/* ---------- Loop ---------- */
function resize(){ if (H) sizeMap(); const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.fov = w < h ? 72 : 55;
  // keep the hall centred in the part of the screen the panel does not cover
  const pr = document.querySelector('.panel').getBoundingClientRect();
  if (w > 760) { const pw = w - pr.left; camera.aspect = (w + pw)/h; camera.setViewOffset(w + pw, h, pw, 0, w, h); }
  else { const ph = Math.max(0, h - pr.top); camera.aspect = w/(h + ph); camera.setViewOffset(w, h + ph, 0, ph, w, h); }
  camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const ease = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const clock = new THREE.Clock(); let acc = 0, ft = 0;
renderer.setAnimationLoop(()=>{
  const dt = clock.getDelta(); ft += dt; acc += dt;
  if (acc > 1/30){ drawScreen(reduce ? 0 : ft); acc = 0; }
  if (tween){
    tween.t = Math.min(1, tween.t + dt/1.3); const k = ease(tween.t);
    camera.position.lerpVectors(tween.fromPos, tween.toPos, k);
    curTarget.lerpVectors(tween.fromT, tween.toTarget, k); camera.lookAt(curTarget);
    if (tween.t >= 1){ const d = tween.done; tween = null; d && d(); }
  } else if (mode === 'seat' && current){
    const eye = metrics(H, current).eye; camera.position.copy(eye);
    const dir = H.SCREEN_C.clone().sub(eye).normalize();
    dir.applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
    const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
    dir.applyAxisAngle(right, pitch);
    curTarget.copy(eye).add(dir.multiplyScalar(10)); camera.lookAt(curTarget);
  } else if (mode === 'hall'){ controls.update(); }
  renderer.render(scene, camera);
});
</script>
